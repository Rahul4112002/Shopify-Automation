<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Listing Studio{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232952cc'/%3E%3Cpath d='M9 12h14l-1.2 12H10.2L9 12Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 12a3.5 3.5 0 0 1 7 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static_asset', filename='styles.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        </span>
        <span class="brand__text">
          <strong>Listing Studio</strong>
          <small>Shopify product listing automation</small>
        </span>
      </a>
      <nav class="app-nav" aria-label="Stores">
        <a href="{{ url_for('store_page', store_key='lavie') }}" class="{{ 'is-active' if active_store == 'lavie' }}">LAVIE</a>
        <a href="{{ url_for('store_page', store_key='akiki') }}" class="{{ 'is-active' if active_store == 'akiki' }}">AKIKI LONDON</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <span>Outputs: Shopify import CSV, Excel backup and a QA report.</span>
    <span>Always cross-check EAN codes, tags, titles and types before importing.</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
